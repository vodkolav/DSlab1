[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Rockets"
version = "0.1.0"
description = "SRM grain reverse design"
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "blinker==1.9.0",
    "certifi==2026.4.22",
    "charset-normalizer==3.4.7",
    "choreographer==1.3.0",
    "click==8.4.0",
    "dash>=4.1.0",
    "docstring-parser==0.18.0",
    "flask==3.1.3",
    "gunicorn==23.0.0",
    "h11==0.16.0",
    "idna==3.15",
    "importlib-metadata==9.0.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "kaleido==0.2.1",
    "logistro==2.0.1",
    "markupsafe==3.0.3",
    "narwhals==2.21.2",
    "nest-asyncio==1.6.0",
    "numpy==2.4.5",
    "pandas",
    "duckdb",
    "orjson>=3.11.9",
    "packaging==26.2",
    "platformdirs==4.9.6",
    "plotly>=6.7.0",
    "requests==2.34.2",
    "retrying==1.4.2",
    "scipy==1.17.1",
    "setuptools==82.0.1",
    "simplejson==4.1.1",
    "typing-extensions==4.15.0",
    "urllib3==2.7.0",
    "uvicorn==0.47.0",
    "werkzeug==3.1.8",
    "zipp==3.23.1"
]

# List development/notebook dependencies here:
[project.optional-dependencies]
dev = [
    "dash[cloud]",
    "ipykernel",    # Required for VS Code Jupyter Notebooks
    "pytest",       # For testing
]